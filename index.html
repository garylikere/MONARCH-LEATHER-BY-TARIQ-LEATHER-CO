<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monarch Leather</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0A0A0A; color: #E0E0E0; padding: 15px; }
        header { background: #121212; border-bottom: 2px solid #D4AF37; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo h1 { color: #D4AF37; font-size: 20px; text-transform: uppercase; }
        .logo p { color: #888; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
        .admin-btn { background: none; border: 1px solid #D4AF37; color: #D4AF37; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .cats-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn { background: #121212; border: 1px solid #333; color: #FFF; padding: 8px 16px; border-radius: 20px; font-size: 11px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .cat-btn:hover, .cat-btn.active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #121212; border: 1px solid #222; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #1A1A1A; border-radius: 4px; }
        .card h4 { font-size: 12px; margin: 8px 0; text-transform: uppercase; height: 32px; overflow: hidden; }
        .price { color: #D4AF37; font-weight: bold; font-size: 14px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-box { background: #121212; border: 1px solid #D4AF37; padding: 20px; border-radius: 8px; width: 100%; max-width: 320px; }
        .row { margin-bottom: 12px; }
        .row label { display: block; font-size: 10px; color: #888; margin-bottom: 4px; text-transform: uppercase; }
        .row input, .row select { width: 100%; background: #0A0A0A; border: 1px solid #333; padding: 8px; color: #FFF; font-size: 12px; border-radius: 4px; }
        .submit-btn { width: 100%; background: #D4AF37; color: #000; padding: 10px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>Monarch Leather</h1>
            <p>Tariq Leather Co.</p>
        </div>
        <button onclick="openAdmin()" class="admin-btn">Admin Panel</button>
    </header>

    <div class="cats-bar">
        <button onclick="filterCat('all')" class="cat-btn">All Items</button>
        <button onclick="filterCat('jackets')" class="cat-btn">Jackets</button>
        <button onclick="filterCat('bags')" class="cat-btn">Bags</button>
        <button onclick="filterCat('shoes')" class="cat-btn">Shoes</button>
        <button onclick="filterCat('wallets')" class="cat-btn">Wallets</button>
    </div>

    <main><div id="grid" class="grid"></div></main>

    <!-- Admin Form -->
    <div id="adminModal" class="modal hidden">
        <div class="modal-box">
            <h3 style="margin-bottom:15px; text-transform:uppercase; font-size:14px; text-align:center;">Add New Item</h3>
            <form onsubmit="addItem(event)">
                <div class="row"><label>Title</label><input type="text" id="t" required></div>
                <div class="row"><label>Price (\$)</label><input type="number" id="p" required></div>
                <div class="row">
                    <label>Category</label>
                    <select id="c">
                        <option value="jackets">Jackets</option>
                        <option value="bags">Bags</option>
                        <option value="shoes">Shoes</option>
                        <option value="wallets">Wallets</option>
                    </select>
                </div>
                <div class="row"><label>Image URL</label><input type="url" id="i" required></div>
                <button type="submit" class="submit-btn">Publish Product</button>
                <button type="button" onclick="closeAdmin()" style="width:100%; background:none; border:none; color:#666; margin-top:8px; font-size:11px; cursor:pointer;">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const initial = [
            { id: 1, title: "Bomber Lambskin Leather Jacket", category: "jackets", price: 189, img: "https://unsplash.com" },
            { id: 2, title: "Luxury Brown Briefcase Bag", category: "bags", price: 139, img: "https://unsplash.com" },
            { id: 3, title: "Monarch OG Leather Bifold Wallet", category: "wallets", price: 45, img: "https://unsplash.com" }
        ];

        let state = JSON.parse(localStorage.getItem('monarch_db')) || initial;
        let currentFilter = "all";

        function render() {
            const grid = document.getElementById("grid");
            const filtered = currentFilter === "all" ? state : state.filter(p => p.category === currentFilter);
            grid.innerHTML = "";
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.img}" alt="Product">
                        <h4>${item.title}</h4>
                        <div class="price">$${item.price}.00</div>
                    </div>
                `;
            });
        }

        function filterCat(cat) { currentFilter = cat; render(); }
        function openAdmin() { document.getElementById("adminModal").classList.remove("hidden"); }
        function closeAdmin() { document.getElementById("adminModal").classList.add("hidden"); }

        function addItem(e) {
            e.preventDefault();
            const n = {
                id: Date.now(),
                title: document.getElementById("t").value,
                price: parseInt(document.getElementById("p").value),
                category: document.getElementById("c").value,
                img: document.getElementById("i").value
            };
            state.unshift(n);
            localStorage.setItem('monarch_db', JSON.stringify(state));
            render();
            e.target.reset();
            closeAdmin();
        }
        window.onload = render;
    </script>
</body>
</html>
