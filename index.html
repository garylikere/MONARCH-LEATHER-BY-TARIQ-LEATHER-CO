<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monarch Leather | Tariq Leather Co.</title>
    <!-- Core Engine Visual Styles Setup Matrix -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0A0A0A; color: #E0E0E0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .promo-bar { background-color: #D4AF37; color: #000; text-align: center; padding: 8px; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        header { background-color: #121212; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo-box { display: flex; items-center: center; gap: 12px; }
        .burger-btn { background: none; border: none; color: #FFF; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .burger-btn:hover { color: #D4AF37; }
        .brand-title { color: #D4AF37; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; line-height: 1; }
        .brand-sub { color: #888; font-size: 8px; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
        .right-actions { display: flex; align-items: center; gap: 15px; }
        .admin-btn { background-color: rgba(212, 175, 55, 0.08); color: #D4AF37; border: 1px solid rgba(212, 175, 55, 0.3); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 6px; }
        .admin-btn:hover { background-color: #D4AF37; color: #000; }
        .cart-icon { color: #FFF; font-size: 18px; position: relative; cursor: pointer; }
        .cart-badge { position: absolute; -top: 8px; -right: 8px; background-color: #D4AF37; color: #000; font-size: 9px; font-weight: bold; padding: 1px 5px; border-radius: 50%; }
        .hero { text-align: center; padding: 45px 20px; background: linear-gradient(#161616, #0A0A0A); border-bottom: 1px solid #1A1A1A; }
        .hero-tag { display: inline-block; bg-color: rgba(212, 175, 55, 0.1); color: #D4AF37; font-size: 10px; font-weight: bold; padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .hero h2 { font-size: 28px; font-weight: 900; color: #FFF; text-transform: uppercase; margin-bottom: 8px; }
        .hero h2 span { color: #D4AF37; }
        .hero p { color: #999; font-size: 13px; max-width: 550px; margin: 0 auto; line-height: 1.5; }
        .masterpiece-section { padding: 30px 20px 10px; text-align: center; }
        .masterpiece-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #666; font-weight: bold; margin-bottom: 2px; }
        .masterpiece-title { font-size: 18px; font-weight: 900; text-transform: uppercase; color: #FFF; letter-spacing: 2px; margin-bottom: 20px; }
        .circle-scroll { display: flex; justify-content: center; gap: 25px; overflow-x: auto; padding-bottom: 12px; }
        .circle-scroll::-webkit-scrollbar { height: 4px; }
        .circle-scroll::-webkit-scrollbar-thumb { background-color: #222; border-radius: 2px; }
        .circle-card { cursor: pointer; text-align: center; min-width: 70px; }
        .circle-outer { width: 56px; height: 56px; border-radius: 50%; background-color: #121212; border: 2px solid rgba(212, 175, 55, 0.2); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; color: #D4AF37; font-size: 16px; transition: 0.3s; }
        .circle-card:hover .circle-outer { border-color: #D4AF37; background-color: rgba(212, 175, 55, 0.08); transform: translateY(-2px); }
        .circle-card p { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: #AAA; }
        .circle-card:hover p { color: #D4AF37; }
        .catalog-container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 20px 20px 40px; flex-grow: 1; }
        .catalog-bar { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #1A1A1A; padding-bottom: 8px; margin-bottom: 20px; }
        .catalog-bar h3 { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .catalog-bar span { font-size: 10px; color: #D4AF37; font-weight: bold; background-color: rgba(212, 175, 55, 0.1); padding: 3px 8px; border-radius: 12px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
        .product-card { background-color: #121212; border: 1px solid #1A1A1A; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .product-card:hover { border-color: rgba(212, 175, 55, 0.3); }
        .image-wrapper { aspect-ratio: 1; background-color: #161616; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .product-card:hover .image-wrapper img { transform: scale(1.03); }
        .sale-badge { position: absolute; top: 8px; left: 8px; background-color: #C2410C; color: #FFF; font-size: 8px; font-weight: bold; padding: 2px 6px; border-radius: 2px; text-transform: uppercase; }
        .details-box { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .details-box h4 { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #DDD; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
        .pricing-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .current-price { color: #D4AF37; font-weight: 900; font-size: 14px; }
        .original-price { color: #555; text-decoration: line-through; font-size: 10px; }
        .cart-btn { width: 100%; margin-top: 10px; background-color: #0A0A0A; border: 1px solid rgba(212, 175, 55, 0.25); color: #D4AF37; padding: 7px; font-size: 9px; text-transform: uppercase; font-weight: bold; cursor: pointer; border-radius: 3px; transition: 0.2s; letter-spacing: 0.5px; }
        .cart-btn:hover { background-color: #D4AF37; color: #000; border-color: #D4AF37; }
        .faq-section { max-width: 700px; margin: 20px auto 40px; padding: 0 20px; width: 100%; }
        .faq-head { text-align: center; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .faq-wrapper { background-color: #121212; border: 1px solid #1A1A1A; border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .faq-trigger { width: 100%; padding: 12px 15px; text-align: left; background: none; border: none; color: #FFF; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .faq-trigger:hover { color: #D4AF37; }
        .faq-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background-color: rgba(0,0,0,0.15); }
        .faq-content p { padding: 12px 15px; font-size: 11px; color: #999; line-height: 1.5; }
        .sidebar { position: fixed; inset: 0; background-color: rgba(0,0,0,0.7); z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .sidebar.active { opacity: 1; pointer-events: auto; }
        .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 260px; background-color: #121212; border-right: 1px solid #1A1A1A; padding: 20px; transform: translateX(-100%); transition: 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar.active .drawer { transform: translateX(0); }
        .drawer-top h3 { color: #D4AF37; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #1A1A1A; padding-bottom: 10px; margin-bottom: 15px; }
        .drawer-nav button { width: 100%; text-align: left; padding: 10px; background: none; border: none; color: #CCC; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; }
        .drawer-nav button:hover { background-color: rgba(212, 175, 55, 0.08); color: #D4AF37; }
        .empty-view { text-align: center; padding: 40px 20px; border: 1px dashed #222; border-radius: 6px; width: 100%; }
        .empty-view i { font-size: 24px; color: #444; margin-bottom: 8px; }
        .empty-view p { font-size: 12px; color: #666; }
        .modal { position: fixed; inset: 0; background-color: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-box { background-color: #121212; border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 8px; max-width: 380px; width: 100%; padding: 20px; position: relative; }
        .close-icon { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #666; font-size: 18px; cursor: pointer; }
        .close-icon:hover { color: #FFF; }
        .input-row { margin-bottom: 12px; }
        .input-row label { display: block; font-size: 10px; text-transform: uppercase; color: #888; margin-bottom: 4px; font-weight: bold; }
        .input-row input, .input-row select { width: 100%; background-color: #0A0A0A; border: 1px solid #1A1A1A; padding: 8px; color: #FFF; font-size: 12px; border-radius: 4px; outline: none; }
        .input-row input:focus, .input-row select:focus { border-color: #D4AF37; }
